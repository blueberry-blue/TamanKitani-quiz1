<title>Taman Kitani Quiz</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: cream page with a sage frame. A circular logo leads the start screen; quizzes are square cards, one question per screen. */
:root {
  --bg: #fbf5e6;
  --surface: #fffdf6;
  --fg: #3b4a2b;
  --muted: #6f7c5a;
  --line: #e2dcc3;
  --sage: #5f7a47;
  --sage-soft: #a3b274;
  --sage-ink: #fffdf6;
  --sun: #f6cf7a;
  --cheek: #f4a39a;
  --good: #3f7a34;
  --good-bg: #e4efcf;
  --bad: #b5483c;
  --bad-bg: #fbe3dd;
  color-scheme: light;
  --font-display: Arial, Helvetica, sans-serif;
  --font-body: Arial, Helvetica, sans-serif;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--font-body); font-size: 16px; line-height: 1.4;
  padding-block: 14px 24px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
main { max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 700; line-height: 1.15; margin: 0; text-wrap: balance; }
p { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; }

.kicker { font-size: 13px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--sage); }
.lede { color: var(--muted); max-width: 46ch; }
.logo { display: block; width: 100%; height: auto; }

/* start screen */
.start { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 14px; min-height: calc(100vh - 90px); }
.start .logo { width: min(48vw, 220px); filter: drop-shadow(0 8px 14px rgba(60, 80, 40, .22)); }
.start h1 { font-size: clamp(1.5rem, 6vw, 2rem); color: var(--sage); }
.start .lede { margin-inline: auto; }
.facts { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; padding: 0; margin: 0; list-style: none; }
.facts li { background: var(--surface); border: 2px solid var(--line); border-radius: 0; padding: 2px 10px; font-size: 14px; font-weight: 700; color: var(--muted); }

.primary {
  background: var(--sage); color: var(--sage-ink); border: 0; border-radius: 0;
  padding: 10px 30px; font-family: var(--font-display); font-weight: 700; font-size: 1.05rem;
  box-shadow: 0 4px 0 var(--sage-soft); transition: transform .1s, box-shadow .1s;
}
.primary:hover { transform: translateY(1px); box-shadow: 0 3px 0 var(--sage-soft); }
.primary:active { transform: translateY(4px); box-shadow: 0 0 0 var(--sage-soft); }
.ghost { background: none; border: 3px solid var(--sage); color: var(--sage); border-radius: 0; padding: 7px 22px; font-family: var(--font-display); font-weight: 700; font-size: 1rem; }

/* quiz list */
.head { display: flex; align-items: center; gap: 12px; padding-bottom: 10px; border-bottom: 3px dashed var(--sage-soft); }
.head .logo { width: 56px; flex: none; }
.head h1 { font-size: 1.5rem; }
.list { display: grid; gap: 8px; }
.card {
  display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; text-align: left;
  background: var(--surface); border: 2px solid var(--line); border-radius: 0; padding: 8px 12px;
  transition: border-color .15s, transform .15s;
}
.card:hover { border-color: var(--sage); transform: translateY(-2px); }
.card .no {
  display: grid; place-items: center; width: 36px; height: 36px; border-radius: 0;
  background: var(--sun); color: #5a4310; font-family: var(--font-display); font-weight: 700; font-size: 1.15rem;
}
.card h2 { font-size: 1.05rem; }
.card .sub { color: var(--muted); font-size: 13px; margin-top: 1px; }
.card .best { font-size: 14px; font-weight: 800; color: var(--muted); text-align: right; white-space: nowrap; }
.card .best.done { color: var(--good); }
@media (max-width: 460px) { .card { grid-template-columns: auto 1fr; } .card .best { grid-column: 2; text-align: left; } }

.topbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.back { background: none; border: 0; padding: 0; color: var(--sage); font-weight: 800; }
.count { font-size: 14px; font-weight: 800; color: var(--muted); font-variant-numeric: tabular-nums; }
.bar { height: 8px; background: var(--line); border-radius: 0; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--sun); border-radius: 0; transition: width .25s; }

.q { display: flex; flex-direction: column; gap: 10px; }
.q h2 { font-size: clamp(1.1rem, 4vw, 1.3rem); }
.opts { display: grid; gap: 8px; grid-template-columns: 1fr 1fr; }
@media (max-width: 520px) { .opts { grid-template-columns: 1fr; } }
.opt {
  display: grid; grid-template-columns: 2.1rem 1fr; align-items: baseline; gap: 8px; text-align: left; min-width: 0;
  background: var(--surface); border: 2px solid var(--line); border-radius: 0; padding: 8px 12px; font-size: 15px;
}
.opt .l { font-family: var(--font-display); font-weight: 600; color: var(--sage); }
.opt:hover:not(:disabled) { border-color: var(--sage); }
.opt:disabled { cursor: default; }
.opt.right { border-color: var(--good); background: var(--good-bg); }
.opt.wrong { border-color: var(--bad); background: var(--bad-bg); }
.opt.right .l { color: var(--good); } .opt.wrong .l { color: var(--bad); }
.opt.dim { opacity: .6; }

.note { background: var(--surface); border: 2px solid var(--sun); padding: 8px 12px; font-size: 15px; border-radius: 0; }
.note b { font-family: var(--font-display); font-weight: 600; }

.result { display: flex; flex-direction: column; gap: 10px; }
.score { display: flex; align-items: baseline; gap: 10px; }
.score strong { font-family: var(--font-display); font-weight: 600; font-size: 2.6rem; line-height: 1; color: var(--sage); font-variant-numeric: tabular-nums; }
.score span { font-size: 1.1rem; color: var(--muted); }
.review { display: grid; gap: 6px; padding: 0; margin: 0; list-style: none; }
.review li { background: var(--surface); border: 2px solid var(--line); border-radius: 0; padding: 6px 12px; display: grid; gap: 1px; min-width: 0; font-size: 14px; }
.review .tag { font-size: 11px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }
.review .tag.ok { color: var(--good); } .review .tag.no { color: var(--bad); }
.review .ans { color: var(--muted); font-size: 13px; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; }

/* answer feedback */
@keyframes pop { 0% { transform: scale(1); } 40% { transform: scale(1.05); } 100% { transform: scale(1); } }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(63, 122, 52, .55); } 100% { box-shadow: 0 0 0 14px rgba(63, 122, 52, 0); } }
@keyframes shake { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-8px); } 40% { transform: translateX(8px); } 60% { transform: translateX(-6px); } 80% { transform: translateX(6px); } }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.opt.right { animation: pop .45s ease-out, pulse .7s ease-out; }
.opt.wrong { animation: shake .45s ease-in-out; }
.opt.right.reveal { animation: pop .45s ease-out .35s; }
.opt .mark { display: none; }
.opt.right .l::after { content: " \2713"; }
.opt.wrong .l::after { content: " \2717"; }
#after > div { animation: rise .35s ease-out .15s both; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

var app = document.getElementById("app");
var LETTERS = ["A", "B", "C", "D"];
var state = { quiz: null, i: 0, picked: null, answers: [] };

function best(n) { try { var v = localStorage.getItem("bpq2-best-" + n); return v === null ? null : +v; } catch (e) { return null; } }
function saveBest(n, s) { try { var b = best(n); if (b === null || s > b) localStorage.setItem("bpq2-best-" + n, s); } catch (e) {} }
function el(html) { var t = document.createElement("template"); t.innerHTML = html.trim(); return t.content.firstChild; }
function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
function mount(node) { app.replaceChildren(node); window.scrollTo(0, 0); }

function welcome() {
  state.quiz = null;
  var n = el('<section class="start"><img class="logo" src="' + LOGO + '" alt="Taman Kitani logo: a smiling tree waving in a park beside a river"><div><p class="kicker">Parks of Brunei</p><h1>Welcome to Taman Kitani</h1></div>' +
    '<p class="lede">Test what you know about five parks in Brunei. Each park has its own quiz, so take them in any order.</p>' +
    '<ul class="facts"><li>5 quizzes</li><li>1 per park</li><li>5 questions each</li><li>4 answers, 1 correct</li></ul>' +
    '<button class="primary" id="go">Start</button></section>');
  n.querySelector("#go").onclick = home;
  mount(n);
}

function home() {
  state.quiz = null;
  var cards = QUIZZES.map(function (z, n) {
    var b = best(n);
    return '<button class="card" data-n="' + n + '"><span class="no">' + (n + 1) + '</span><span><h2>' + esc(z.title) +
      '</h2><p class="sub">' + esc(z.sub) + ' &middot; 5 questions</p></span><span class="best' + (b === 5 ? " done" : "") + '">' +
      (b === null ? "Not taken" : "Best " + b + "/5") + "</span></button>";
  }).join("");
  var n = el('<div style="display:contents"><header class="head"><img class="logo" src="' + LOGO + '" alt=""><div><p class="kicker">Taman Kitani</p><h1>Choose a quiz</h1></div></header>' +
    '<section class="list">' + cards + "</section></div>");
  n.querySelectorAll(".card").forEach(function (b) { b.onclick = function () { start(+b.dataset.n); }; });
  mount(n);
}

function start(n) { state = { quiz: n, i: 0, picked: null, answers: [] }; question(); }

function question() {
  var z = QUIZZES[state.quiz], q = z.questions[state.i], total = z.questions.length;
  var opts = q.a.map(function (t, k) {
    return '<button class="opt" data-k="' + k + '"><span class="l">' + LETTERS[k] + '</span><span>' + esc(t) + "</span></button>";
  }).join("");
  var n = el('<div style="display:contents"><div class="topbar"><button class="back" id="back">&larr; All quizzes</button>' +
    '<span class="count">Question ' + (state.i + 1) + " of " + total + '</span></div>' +
    '<div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="' + total + '" aria-valuenow="' + state.i + '"><i style="width:' + (state.i / total * 100) + '%"></i></div>' +
    '<section class="q"><p class="kicker">' + esc(z.title) + "</p><h2>" + esc(q.q) + '</h2><div class="opts">' + opts + '</div><div id="after"></div></section></div>');
  n.querySelector("#back").onclick = home;
  n.querySelectorAll(".opt").forEach(function (b) { b.onclick = function () { choose(+b.dataset.k); }; });
  mount(n);
}

function choose(k) {
  if (state.picked !== null) return;
  state.picked = k;
  var z = QUIZZES[state.quiz], q = z.questions[state.i], ok = k === q.c;
  state.answers.push(k);
  document.querySelectorAll(".opt").forEach(function (b, j) {
    b.disabled = true;
    if (j === q.c) { b.classList.add("right"); if (!ok) b.classList.add("reveal"); }
    else if (j === k) b.classList.add("wrong");
    else b.classList.add("dim");
  });
  var last = state.i === z.questions.length - 1;
  var after = document.getElementById("after");
  after.replaceChildren(el('<div style="display:grid;gap:8px"><p class="note"><b>' + (ok ? "Correct." : "Not quite.") + "</b> " + esc(q.e) +
    '</p><button class="primary" id="next">' + (last ? "See my score" : "Next question") + "</button></div>"));
  var nx = document.getElementById("next");
  nx.onclick = function () { state.picked = null; if (last) results(); else { state.i++; question(); } };
  nx.focus();
}

function results() {
  var z = QUIZZES[state.quiz];
  var score = z.questions.reduce(function (s, q, i) { return s + (state.answers[i] === q.c ? 1 : 0); }, 0);
  saveBest(state.quiz, score);
  var msg = score === 5 ? "Perfect score. Well done!" : score >= 3 ? "Good work." : "Keep exploring the parks and try again.";
  var rev = z.questions.map(function (q, i) {
    var ok = state.answers[i] === q.c;
    return '<li><span class="tag ' + (ok ? "ok" : "no") + '">' + (ok ? "Correct" : "Incorrect") + "</span><strong>" + esc(q.q) + "</strong>" +
      '<span class="ans">' + (ok ? "" : "You chose: " + esc(q.a[state.answers[i]]) + ". ") + "Answer: " + esc(q.a[q.c]) + "</span></li>";
  }).join("");
  var next = state.quiz < QUIZZES.length - 1;
  var n = el('<div style="display:contents"><div class="topbar"><button class="back" id="back">&larr; All quizzes</button><span class="count">' + esc(z.title) + '</span></div>' +
    '<section class="result"><div><p class="kicker">Your score</p><div class="score"><strong>' + score + "</strong><span>/ 5</span></div><p class=\"lede\">" + msg + "</p></div>" +
    '<div class="actions"><button class="primary" id="retry">Try again</button>' +
    (next ? '<button class="ghost" id="nextq">Next quiz</button>' : "") + '</div><ol class="review">' + rev + "</ol></section></div>");
  n.querySelector("#back").onclick = home;
  n.querySelector("#retry").onclick = function () { start(state.quiz); };
  var nq = n.querySelector("#nextq"); if (nq) nq.onclick = function () { start(state.quiz + 1); };
  mount(n);
}

welcome();
</script>
